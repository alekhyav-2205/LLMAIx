services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile_metal
    image: ghcr.io/katherlab/llmaix-metal:latest
    ports:
      - "19999:${PORT:-5000}"
    volumes:
      - ./models:/models
    environment:
      - SERVER_PATH=${SERVER_PATH:-/build/llama.cpp/llama-server}
      - PORT=${PORT:-5000}
      - HOST=${HOST:-0.0.0.0}
      - CONFIG_FILE=${CONFIG_FILE:-/models/config.yml}
      - GPU=${GPU:-NONE}
      - LLAMACPP_PORT=${LLAMACPP_PORT:-2929}
      - DEBUG=${DEBUG:-true}
      - MODE=${MODE:-choice}
      - VERBOSE_LLAMA=${VERBOSE_LLAMA:-false}
      - PASSWORD=${PASSWORD:-}
      - API_URL=${API_URL:-}
      - API_KEY=${API_KEY:-}
      - ONLY_API=${ONLY_API:-false}
